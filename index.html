<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Animated Font Features</title>
  
  <!-- Load Alpha Lyrae font -->
<style>
  @import url('https://db.onlinewebfonts.com/c/db094b757166eb27175116d69811f527?family=Alpha+Lyrae');

  .dev-container {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Alpha Lyrae", sans-serif;
    text-align: center;
  }

  .dev-container h1 {
    color: white;
    font-family: 'Alpha Lyrae', sans-serif;
  }

  .dev-container .animated-text {
    letter-spacing: 0.01em;
    line-height: 1.1em;
    display: inline-block;
    word-wrap: break-word;
  }

  .dev-container .word {
    display: inline-block;
    white-space: nowrap;
  }

  .dev-container .char {
    display: inline-block;
    position: relative;
    font-family: 'Alpha Lyrae', sans-serif;
    font-weight: 500;
    opacity: 0.8;
    transition: opacity 0.1s ease, transform 0.3s ease;
    font-feature-settings: 'liga' on;
  }

  /* Hover: apply quick opacity + scale */
  .dev-container .char:hover {
    opacity: 0.2;
    transform: scale(1.05);
  }

  /* On mouseout: slow fade back */
  .dev-container .char.remove-opacity {
    opacity: 0.9;
    transition: opacity 2s ease; /* Slow fade-in */
  }

  .dev-container .space {
    display: inline-block;
    width: 0.3em;
  }

  /* Pulse animation (optional, for extra liveliness) */
  @keyframes pulse {
    0%, 100% { opacity: 0.8; }
    50% { opacity: 1; }
  }

  .dev-container .char.animated {
    animation: pulse 2s ease-in-out infinite;
  }

  .dev-container #dev-animatedText {
    font-size: 70px;
    max-width: 700px;
  }

  @media (max-width: 475px){
    h1#dev-animatedText {
      font-size: 40px !important;
      text-align: center !important;
    }
  }


    .dev-toolbar {
      display: flex;
      align-items: center;
      background: #0f0f10;
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 4px;
      height: 46px;
      width: 100%;
      max-width: 1300px;
      overflow: hidden;
    }

    /* Each section divided by subtle border */
    .dev-toolbar .toolbar-section {
      display: flex;
      align-items: center;
      justify-content: center;
      flex: 1;
      height: 100%;
      border-right: 1px solid rgba(255, 255, 255, 0.04);
    }

    .dev-toolbar .toolbar-section:last-child {
      border-right: none;
    }

    /* Circle buttons (like in your image) */
    .dev-toolbar .circle {
      width: 20px;
      height: 20px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 50%;
      margin: 0 6px;
    }

    /* Center empty section line preview */
    .dev-toolbar .line {
      width: 150px;
      height: 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.03);
    }




</style>
</head>
<body>

  <div class="dev-container">
    <div class="dotted-bg absolute inset-0 z-[-1]"></div>
    <h1 class="animated-text" id="dev-animatedText">
      AI-Native Business Intelligence
    </h1>
  </div>
  <div class="dev-toolbar">
    <div class="toolbar-section">
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
    <div class="toolbar-section">
      <div class="line"></div>
    </div>
    <div class="toolbar-section">
      <div class="circle"></div>
      <div class="circle"></div>
      <div class="circle"></div>
    </div>
  </div>

<script>
  const text = "Your dictation, transformed by AI.";
  const container = document.getElementById('dev-animatedText');

  // Wrap words and characters
  const words = text.split(' ');
  container.innerHTML = words.map(word => {
    const letters = word.split('').map(char =>
      `<span class="char">${char}</span>`
    ).join('');
    return `<span class="word">${letters}</span>`;
  }).join('<span class="space"></span>');

  const chars = document.querySelectorAll('.char');

  // Random font feature toggling
  chars.forEach(char => {
    let toggle = false;

    function randomToggle() {
      toggle = !toggle;
      char.style.fontFeatureSettings = toggle
        ? "'ss01' on, 'liga' on"
        : "'liga' on";

      setTimeout(randomToggle, 2500 + Math.random() * 5000);
    }

    setTimeout(randomToggle, Math.random() * 5000);
  });

  // Handle hover with class-based transition
  container.addEventListener('mouseover', (e) => {
    if (e.target.classList.contains('char')) {
      e.target.classList.remove('remove-opacity');
      e.target.style.opacity = '0.2'; // Quick fade out
    }
  });

  container.addEventListener('mouseout', (e) => {
    if (e.target.classList.contains('char')) {
      // Reset inline opacity
      e.target.style.opacity = '';
      // Trigger slow fade-in using CSS class
      e.target.classList.add('remove-opacity');

      // Remove the class after transition completes (optional cleanup)
      setTimeout(() => {
        e.target.classList.remove('remove-opacity');
      }, 2000); // Should match transition duration (0.6s + buffer)
    }
  });
</script>

</body>
</html>
